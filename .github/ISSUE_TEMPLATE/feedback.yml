name: Feedback on PhyloVista
description: Tell us how the demo worked for you (5 minutes).
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying PhyloVista! Short answers are fine; skip anything you like.
        Note: this form becomes a public GitHub issue.
  - type: dropdown
    id: dataset
    attributes:
      label: What did you try?
      multiple: true
      options:
        - Archaea demo (tree + taxonomy + metadata)
        - NCBI vs GTDB demo
        - Full bacterial tree demo
        - Built-in example
        - My own tree / data
        - The downloadable single file
  - type: textarea
    id: usecase
    attributes:
      label: What would you use a tool like this for?
      description: e.g. placing new genomes/MAGs, comparing taxonomies, figures, teaching, choosing genomes…
  - type: textarea
    id: good
    attributes:
      label: What worked well?
  - type: textarea
    id: bad
    attributes:
      label: What was confusing, slow or broken?
      description: Steps to reproduce help a lot. Screenshots welcome (drag them in).
  - type: textarea
    id: missing
    attributes:
      label: What is missing for your work?
  - type: dropdown
    id: rating
    attributes:
      label: Overall, how useful is it?
      options:
        - 5 — I would use it now
        - 4 — useful, with a few fixes
        - 3 — interesting, not there yet
        - 2 — not very useful for me
        - 1 — not useful
  - type: dropdown
    id: compare
    attributes:
      label: Which tools do you use for trees today?
      multiple: true
      options:
        - iTOL
        - ARB
        - FigTree
        - ggtree / R
        - ETE / TreeProfiler
        - AnnoTree
        - Taxonium
        - Dendroscope
        - Other
  - type: input
    id: system
    attributes:
      label: Browser and computer
      placeholder: e.g. Chrome 140 on a 2021 MacBook Air
  - type: textarea
    id: other
    attributes:
      label: Anything else?
